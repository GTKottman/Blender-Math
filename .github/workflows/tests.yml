name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the bpy 4.2 wheel targets Python 3.11
      - name: Install LaTeX (for the full typesetting backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended cm-super
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" "bpy==4.2.0"
      - name: Test
        run: pytest -q
